<script>
window.addEventListener('DOMContentLoaded', () => {
    const modalElement = document.getElementById('customModal');
    const modalInstance = new bootstrap.Modal(modalElement);
    modalInstance.show();

    //hide the global navigation
    const htm_btn_1 = document.getElementById("htm-btn-1");
    const htm_btn_2 = document.getElementById("htm-btn-2");
    const htm_btn_3 = document.getElementById("htm-btn-3");    

    htm_btn_1.style.display = "none";
    htm_btn_2.style.display = "none";
    htm_btn_3.style.display = "none";

    const nextButton = document.getElementById("next-button");

    // Close modal when any option button is clicked
    document.querySelectorAll('.option-btn').forEach(button => {
      button.addEventListener('click', () => {
        modalInstance.hide();
            htm_btn_1.style.display = "block";
            htm_btn_2.style.display = "block";
            htm_btn_3.style.display = "block";
            nextButton.style.display = "block";

            console.log(guideType());

            handleGuide('intro');
      });
    });
  });
</script>
